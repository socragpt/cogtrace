[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cogtrace"
version = "0.1.0"
description = "Research scaffold for structured chain-of-thought monitoring"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "CogTrace contributors"}]
dependencies = []

[project.scripts]
cogtrace = "cogtrace.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
